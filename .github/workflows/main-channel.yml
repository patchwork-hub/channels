run-name: Deploy to Main Channel Container by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - main-channel
env:
  SIDEKIQ_DEFINITION: .aws/main-channel-sidekiq.json

permissions:
  contents: read
  id-token: write # Added for OIDC token support

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # Changed to true for more efficient queue management

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Added timeout to prevent runaway builds

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to latest version
        with:
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4 # Updated to latest version
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Updated to latest version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Updated to latest version
        with:
          version: latest
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Cache Docker Layers
        uses: actions/cache@v4 # Updated to latest version
        with:
          path: |
            /tmp/.buildx-cache
            /tmp/.yarn-cache
            /tmp/.bundle-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref }}
            ${{ runner.os }}-buildx-

      - name: Build and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPOSITORY }}
          IMAGE_TAG: ${{ vars.CHANNEL_IMAGE_TAG }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # Temp fix for build cache
      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache


  build-streaming:
    name: Build Streaming Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers for streaming
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-streaming
          key: ${{ runner.os }}-buildx-streaming-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-streaming-
            ${{ runner.os }}-buildx-

      - name: Build and push streaming image
        id: build-streaming-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPOSITORY }}
          IMAGE_TAG: ${{ vars.STREAMING_MAIN_CHANNEL_IMAGE_TAG }}
        run: |
          echo "Building streaming service image..."
          docker buildx build \
            --platform linux/amd64 \
            --file ./streaming/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache-streaming \
            --cache-to type=local,dest=/tmp/.buildx-cache-streaming-new,mode=max \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache-streaming
          mv /tmp/.buildx-cache-streaming-new /tmp/.buildx-cache-streaming

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  deploy-channel-web:
    name: Deploy to Main Channel Web Container
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Git Checkout
        uses: actions/checkout@v2
      - name: Echo Branch
        run: echo running on branch ${GITHUB_REF##*/}
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_MAIN_CHANNEL_IP }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PROD_MAIN_CHANNEL_KEY }}
          script: |
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa
            cd /home/ubuntu/channel-automation
            bash channel-deploy.sh

  deploy-channel-sidekiq:
    name: Deploy to Main Channel Sidekiq Container
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Updated to latest version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4 # Updated to latest version
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Updated to latest version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Updated to latest version

      - name: Cache Docker Layers
        uses: actions/cache@v4 # Updated to latest version
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Fill in the new image ID in the Amazon ECS task definition (Sidekiq)
        id: task-def-sidekiq
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.SIDEKIQ_DEFINITION }}
          container-name: ${{ secrets.MAIN_CHANNEL_SIDEKIQ_CONTAINER }}
          image: ${{ secrets.MAIN_CHANNEL_SIDEKIQ_IMAGE }}

      - name: Deploy Amazon ECS task definition (Sidekiq)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-sidekiq.outputs.task-definition }}
          service: ${{ secrets.MAIN_CHANNEL_SERVICE }}
          cluster: ${{ secrets.MAIN_CHANNEL_CLUSTER }}
          wait-for-service-stability: false
