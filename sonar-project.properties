# SonarQube Project Configuration
sonar.projectKey=patchwork-hub_channels_25ae8051-d51a-4d07-a6c0-4a568396d4fa
sonar.projectName=Mastodon Channels
sonar.projectVersion=1.0

# Source directories
sonar.sources=app/javascript,app/controllers,app/models,app/services,app/helpers,app/mailers,app/views,lib

# Test directories
sonar.tests=spec,app/javascript/**/__tests__,app/javascript/**/*.test.js,app/javascript/**/*.test.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/public/**,**/tmp/**,**/log/**,db/migrate/**,**/coverage/**,**/*.min.js,**/*.bundle.js

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Ruby settings
sonar.ruby.coverage.reportPaths=coverage/.resultset.json

# File encoding
sonar.sourceEncoding=UTF-8

# Quality gate settings
sonar.qualitygate.wait=true
